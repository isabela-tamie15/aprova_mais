# Blueprint do Render: serviço web (Docker), PostgreSQL e Key Value (Redis).
# As variáveis com "sync: false" são pedidas na criação
services:
  - type: web
    name: aprovamais
    runtime: docker
    plan: free
    region: virginia
    branch: main
    dockerfilePath: ./Dockerfile
    # O /readyz fica na porta da aplicação
    healthCheckPath: /readyz
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        fromDatabase:
          name: aprovamais-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: aprovamais-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: aprovamais-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: aprovamais-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: aprovamais-db
          property: password
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: aprovamais-redis
          property: connectionString
      # Gerado pelo Render na criação
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_SECRET
        generateValue: true
      # Endereço público, por exemplo https://aprovamais.onrender.com
      - key: APP_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_REMETENTE
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY
        sync: false
      - key: R2_SECRET_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: ADMIN_INICIAL_EMAIL
        sync: false
      - key: ADMIN_INICIAL_SENHA
        sync: false
      - key: ADMIN_INICIAL_NOME
        sync: false
      # Secretaria inicial
      - key: SECRETARIA_INICIAL_EMAIL
        sync: false
      - key: SECRETARIA_INICIAL_SENHA
        sync: false
      - key: SECRETARIA_INICIAL_NOME
        sync: false

  # Redis da lista de tokens revogados, acessível só pelos serviços do Render
  - type: keyvalue
    name: aprovamais-redis
    plan: free
    region: virginia
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  - name: aprovamais-db
    plan: free
    region: virginia
    databaseName: dbaprovamais
    user: aprova
