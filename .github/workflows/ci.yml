# CI: roda os testes a cada push e PR para a develop e a main, no perfil test (H2 em memória)
name: CI

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "25"
          cache: "maven"

      # O bit de execução do mvnw se perde no Windows
      - name: Permissão do Maven Wrapper
        run: chmod +x mvnw

      - name: Testes
        run: ./mvnw -B test
