spring.application.name=aprovamais

### O perfil (dev ou prod) vem da variável SPRING_PROFILES_ACTIVE. Sem ela, a aplicação não sobe (ValidadorConfiguracao)

### Persistencia de dados ###
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

### JPA ###
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

### JWT ###
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=28800000
jwt.pre-auth-expiration=2

### Criptografia AES ###
encryption.secret=${ENCRYPTION_SECRET}

### Redis ###
### Lista de tokens encerrados pelo logout. No perfil prod, a conexão vem do REDIS_URL
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2s

### Actuator e Prometheus ###
### Métricas na porta 9090, fora da porta da aplicação. O /readyz e o /livez ficam na porta da aplicação
management.server.port=${MANAGEMENT_PORT:9090}
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=true
### Histograma do tempo de resposta, para o p95 no Grafana
management.metrics.distribution.percentiles-histogram.http.server.requests=true

### Resend ###
resend.api-key=${RESEND_API_KEY}

### Cookie do login ###
app.cookie.secure=${COOKIE_SECURE:false}

### Remetente dos e-mails (Resend). Sem domínio verificado, fica o endereço de teste do Resend
app.email.remetente=${EMAIL_REMETENTE:Aprova+ <onboarding@resend.dev>}

### URL base da aplicacao ###
app.url=${APP_URL:http://localhost:8080}

### Administrador inicial ###
app.admin-inicial.email=${ADMIN_INICIAL_EMAIL:}
app.admin-inicial.senha=${ADMIN_INICIAL_SENHA:}
app.admin-inicial.nome=${ADMIN_INICIAL_NOME:}

### Secretaria inicial ###
### Criada na inicializacao apenas se nao existir nenhuma secretaria (ver ContaInicialService)
app.secretaria-inicial.email=${SECRETARIA_INICIAL_EMAIL:}
app.secretaria-inicial.senha=${SECRETARIA_INICIAL_SENHA:}
app.secretaria-inicial.nome=${SECRETARIA_INICIAL_NOME:}

### Consulta de CNPJ (BrasilAPI) ###
### Tempo maximo de espera, passou disso, o cadastro segue sem a verificacao
aprova.cnpj.api-url=https://brasilapi.com.br/api/cnpj/v1
aprova.cnpj.timeout-conexao-ms=3000
aprova.cnpj.timeout-leitura-ms=5000

### Arquivos estaticos (css e js) ###
### Coloca um hash do conteudo no nome do arquivo nos links gerados com th:src e th:href. Quando o arquivo muda, o nome muda, e o navegador baixa a versao nova em vez de usar a que guardou em cache
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/css/**,/js/**

### Thymeleaf ###
spring.thymeleaf.cache=false

### Swagger ###
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.paths-to-match=/api/**
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method

### Auditoria: prazo de guarda dos registros, em meses (RF45) ###
app.auditoria.retencao-meses=6

### Limite de requisições por IP nas rotas de autenticação e na consulta de CNPJ ###
app.limite.requisicoes-por-minuto=${LIMITE_REQUISICOES_POR_MINUTO:250}

### Logging ###
logging.file.name=logs/auditoria.log
logging.level.tcc.ges.aprovamais.service=INFO

### Entregas: arquivos de até 10 MB (RN56) ###
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
# Lê o restante de um envio grande demais, para o navegador receber a mensagem de erro em vez de conexão cortada
server.tomcat.max-swallow-size=20MB
# Pasta dos arquivos quando o Cloudflare R2 não está configurado. No Docker, é o volume ./uploads
aprova.armazenamento.diretorio=${ARMAZENAMENTO_DIRETORIO:uploads}
