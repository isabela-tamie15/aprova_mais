spring.application.name=aprovamais

### Persistencia de dados ###
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

### JPA ###
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

### E-mail SMTP ###
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

### TLS/HTTPS ###
server.port=8443
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=aprovamais

### JWT ###
jwt.secret=${JWT_SECRET}
jwt.expiration=28800000
jwt.pre-auth-expiration=2

### Criptografia AES ###
encryption.secret=${ENCRYPTION_SECRET}

### Redis ###
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

### Cloudflare R2 ###
r2.access-key=${R2_ACCESS_KEY}
r2.secret-key=${R2_SECRET_KEY}
r2.bucket=${R2_BUCKET}
r2.endpoint=${R2_ENDPOINT}
r2.region=auto

### Prometheus ###
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.prometheus.enabled=true
management.endpoint.health.show-details=when-authorized

### ENTRY ###
sentry.dsn=${SENTRY_DSN}
sentry.traces-sample-rate=1.0
sentry.environment=production

### THYMELEAF ###
spring.thymeleaf.cache=false

### SWAGGER ###
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

### LOGGING ###
logging.file.name=logs/auditoria.log
logging.level.tcc.ges.aprovamais.service=INFO