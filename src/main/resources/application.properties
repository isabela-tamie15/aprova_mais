spring.application.name=aprovamais

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

### Persistencia de dados ###
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

### JPA ###
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

### E-mail SMTP ###
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

### JWT ###
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=28800000
jwt.pre-auth-expiration=2

### Criptografia AES ###
encryption.secret=${ENCRYPTION_SECRET}

### Redis ###
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

### Prometheus ###
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.prometheus.enabled=true
management.endpoint.health.show-details=when-authorized

### Resend ###
resend.api-key=${RESEND_API_KEY}

### URL base da aplicacao ###
app.url=${APP_URL:http://localhost:8080}

### Administrador inicial ###
app.admin-inicial.email=${ADMIN_INICIAL_EMAIL:}
app.admin-inicial.senha=${ADMIN_INICIAL_SENHA:}
app.admin-inicial.nome=${ADMIN_INICIAL_NOME:}

### Secretaria inicial ###
### Criada na inicializacao apenas se nao existir nenhuma secretaria (ver ContaInicialService)
app.secretaria-inicial.email=${SECRETARIA_INICIAL_EMAIL:}
app.secretaria-inicial.senha=${SECRETARIA_INICIAL_SENHA:}
app.secretaria-inicial.nome=${SECRETARIA_INICIAL_NOME:}

### Consulta de CNPJ (BrasilAPI) ###
### Tempo maximo de espera, passou disso, o cadastro segue sem a verificacao
aprova.cnpj.api-url=https://brasilapi.com.br/api/cnpj/v1
aprova.cnpj.timeout-conexao-ms=3000
aprova.cnpj.timeout-leitura-ms=5000

### Arquivos estaticos (css e js) ###
### Coloca um hash do conteudo no nome do arquivo nos links gerados com th:src e th:href. Quando o arquivo muda, o nome muda, e o navegador baixa a versao nova em vez de usar a que guardou em cache
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/css/**,/js/**

### Thymeleaf ###
spring.thymeleaf.cache=false

### Swagger ###
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.paths-to-match=/api/**
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method

### Logging ###
logging.file.name=logs/auditoria.log
logging.level.tcc.ges.aprovamais.service=INFO
