spring.application.name=aprovamais

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

### Persistencia de dados ###
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

### JPA ###
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

### E-mail SMTP ###
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

### JWT ###
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=28800000
jwt.pre-auth-expiration=2

### Criptografia AES ###
encryption.secret=${ENCRYPTION_SECRET}

### Redis ###
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

### Prometheus ###
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.prometheus.enabled=true
management.endpoint.health.show-details=when-authorized

### Thymeleaf ###
spring.thymeleaf.cache=false

### Swagger ###
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

### Logging ###
logging.file.name=logs/auditoria.log
logging.level.tcc.ges.aprovamais.service=INFO