<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprova+ | Solicitações</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/main.css}" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar-coordenador :: navbar('solicitacoes')}"></div>

<div class="container" x-data="painelSolicitacoes('/api/v1/coordenador/solicitacoes', 'EM_ANALISE_COORDENACAO', true)"
     x-init="init()" style="max-width: 900px;">
    <h4 class="fw-bold mb-1">Solicitações</h4>
    <p class="text-muted mb-4">Troca de modalidade e aprovação final do trancamento, depois da validação da secretaria.</p>

    <div class="alert alert-danger" x-show="erro" x-text="erro" x-cloak></div>
    <div class="alert alert-success" x-show="sucesso" x-text="sucesso" x-cloak></div>
    <p class="text-muted" x-show="carregando">Carregando...</p>

    <div class="card p-4 text-center" x-show="!carregando && cursos.length === 0" x-cloak>
        <p class="text-muted mb-0">Você ainda não tem cursos cadastrados.</p>
    </div>

    <div x-show="!carregando && cursos.length > 0" x-cloak>
        <div class="mb-4" style="max-width: 420px;">
            <label class="form-label" for="curso">Curso</label>
            <select id="curso" class="form-select" x-model="cursoId" @change="sucesso = ''; carregar()">
                <template x-for="curso in cursos" :key="curso.id">
                    <option :value="curso.id" x-text="curso.nome"></option>
                </template>
            </select>
        </div>

        <div th:replace="~{fragments/lista-solicitacoes :: lista}"></div>
    </div>
</div>

<script th:src="@{/js/comum.js}"></script>
<script th:src="@{/js/paginas/solicitacoes-comum.js}"></script>

<div th:replace="~{fragments/rodape-lgpd :: rodape}"></div>
</body>
</html>
