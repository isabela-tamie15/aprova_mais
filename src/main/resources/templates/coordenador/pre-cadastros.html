<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprova+ | Pré-cadastro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/main.css}" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar-coordenador :: navbar('pre-cadastros')}"></div>

<!-- RF02: lista das pessoas autorizadas a receber convite da Secretaria -->
<div class="container" x-data="preCadastrosPagina()" style="max-width: 1000px;">
    <h4 class="fw-bold mb-1">Pré-cadastro</h4>
    <p class="text-muted mb-4">Só quem está nesta lista pode receber o convite da Secretaria para criar a conta.</p>

    <div class="alert alert-danger" x-show="erro" x-text="erro" x-cloak></div>
    <div class="alert alert-success" x-show="sucesso" x-text="sucesso" x-cloak></div>

    <p class="text-muted" x-show="carregando">Carregando...</p>

    <!-- Sem curso não há turma para o aluno -->
    <div class="card p-4 text-center" x-show="!carregando && cursos.length === 0" x-cloak>
        <p class="text-muted mb-2">Você ainda não tem cursos cadastrados.</p>
        <a href="/coordenador/cursos" class="btn btn-primary">Cadastrar um curso</a>
    </div>

    <div x-show="!carregando && cursos.length > 0" x-cloak>
        <!-- Formulário: inclui uma pessoa nova ou altera a pessoa escolhida na tabela -->
        <div class="card p-4 mb-4" x-ref="formulario">
            <h5 class="card-title mb-3" x-text="form.id ? 'Alterar pré-cadastro' : 'Novo pré-cadastro'"></h5>
            <form @submit.prevent="salvar()" novalidate>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label" for="nome">Nome completo</label>
                        <input id="nome" type="text" class="form-control" x-model="form.nome" maxlength="150"
                               :class="{ 'is-invalid': erros.nome }">
                        <div class="invalid-feedback" x-text="erros.nome"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="email">E-mail</label>
                        <input id="email" type="email" class="form-control" x-model="form.email" maxlength="254"
                               :class="{ 'is-invalid': erros.email }">
                        <div class="invalid-feedback" x-text="erros.email"></div>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label" for="perfil">Perfil</label>
                        <select id="perfil" class="form-select" x-model="form.perfil"
                                :class="{ 'is-invalid': erros.perfil }">
                            <option value="">Selecione...</option>
                            <option value="ALUNO">Aluno</option>
                            <option value="ORIENTADOR">Orientador</option>
                        </select>
                        <div class="invalid-feedback" x-text="erros.perfil"></div>
                    </div>
                    <div class="col-md-3">
                        <!-- RGM para aluno, matrícula institucional para orientador -->
                        <label class="form-label" for="identificador"
                               x-text="form.perfil === 'ORIENTADOR' ? 'Matrícula institucional' : 'RGM'"></label>
                        <input id="identificador" type="text" class="form-control" x-model="form.identificadorInstitucional"
                               maxlength="50" :class="{ 'is-invalid': erros.identificadorInstitucional }">
                        <div class="invalid-feedback" x-text="erros.identificadorInstitucional"></div>
                    </div>
                    <!-- Para orientador a turma fica vazia (passo 3 do RF02) -->
                    <div class="col-md-3" x-show="form.perfil === 'ALUNO'">
                        <label class="form-label" for="curso">Curso</label>
                        <select id="curso" class="form-select" x-model="form.cursoId" @change="form.turmaId = ''">
                            <template x-for="curso in cursos" :key="curso.id">
                                <option :value="curso.id" x-text="curso.nome"></option>
                            </template>
                        </select>
                    </div>
                    <div class="col-md-3" x-show="form.perfil === 'ALUNO'">
                        <label class="form-label" for="turma">Turma</label>
                        <select id="turma" class="form-select" x-model="form.turmaId"
                                :class="{ 'is-invalid': erros.turmaId }">
                            <option value="">Selecione...</option>
                            <template x-for="turma in (turmasPorCurso[form.cursoId] || [])" :key="turma.id">
                                <option :value="turma.id" x-text="turma.semestre + ' - ' + turma.identificador"></option>
                            </template>
                        </select>
                        <div class="invalid-feedback" x-text="erros.turmaId"></div>
                    </div>
                </div>
                <div class="d-flex gap-2 mt-3">
                    <button type="submit" class="btn btn-primary" :disabled="salvando">
                        <span x-show="!salvando" x-text="form.id ? 'Salvar alterações' : 'Incluir na lista'"></span>
                        <span x-show="salvando" x-cloak>Salvando...</span>
                    </button>
                    <button type="button" class="btn btn-outline-secondary" x-show="form.id" x-cloak
                            @click="cancelar()">Cancelar</button>
                </div>
            </form>
        </div>

        <!-- Lista do coordenador logado, com a situação de cada pessoa -->
        <div class="card p-4">
            <h5 class="card-title mb-3">Pessoas autorizadas</h5>
            <p class="text-muted mb-0" x-show="preCadastros.length === 0">Nenhuma pessoa na lista.</p>
            <div class="table-responsive" x-show="preCadastros.length > 0">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                    <tr>
                        <th>Nome</th>
                        <th>E-mail</th>
                        <th>Perfil</th>
                        <th>RGM ou matrícula</th>
                        <th>Turma</th>
                        <th>Situação</th>
                        <th class="text-end">Ações</th>
                    </tr>
                    </thead>
                    <tbody>
                    <template x-for="item in preCadastros" :key="item.id">
                        <tr>
                            <td x-text="item.nome"></td>
                            <td x-text="item.email"></td>
                            <td x-text="item.perfil === 'ALUNO' ? 'Aluno' : 'Orientador'"></td>
                            <td x-text="item.identificadorInstitucional"></td>
                            <td x-text="item.descricaoTurma ? item.nomeCurso + ', ' + item.descricaoTurma : '-'"></td>
                            <td><span class="badge" :class="classesSituacao[item.situacao]"
                                      x-text="nomesSituacao[item.situacao]"></span></td>
                            <td class="text-end">
                                <!-- Depois do cadastro concluído, os dados estão na conta e não mudam mais por aqui -->
                                <button class="btn btn-sm btn-outline-primary" @click="editar(item)"
                                        x-show="item.situacao !== 'CADASTRO_CONCLUIDO'">Editar</button>
                            </td>
                        </tr>
                    </template>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/js/comum.js}"></script>
<script th:src="@{/js/coordenador.js}"></script>
<script th:src="@{/js/paginas/coordenador-pre-cadastros.js}"></script>

<div th:replace="~{fragments/rodape-lgpd :: rodape}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
