<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprova+ | Cursos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/main.css}" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar-coordenador :: navbar('cursos')}"></div>

<div class="container" x-data="cursosPagina()" x-init="init()" style="max-width: 900px;">
    <h4 class="fw-bold mb-1">Cursos</h4>
    <p class="text-muted mb-4">Os cursos que você cadastra ficam sob a sua coordenação.</p>

    <div class="alert alert-danger" x-show="erro" x-text="erro" x-cloak></div>
    <div class="alert alert-success" x-show="sucesso" x-text="sucesso" x-cloak></div>

    <!-- Formulário: cadastra um curso novo ou altera o curso escolhido na tabela -->
    <div class="card p-4 mb-4" x-ref="formulario">
        <h5 class="card-title mb-3" x-text="form.id ? 'Alterar curso' : 'Novo curso'"></h5>
        <form @submit.prevent="salvar()" novalidate>
            <div class="row g-3">
                <div class="col-md-8">
                    <label class="form-label" for="nome">Nome do curso</label>
                    <input id="nome" type="text" class="form-control" x-model="form.nome"
                           maxlength="150" :class="{ 'is-invalid': erros.nome }">
                    <div class="invalid-feedback" x-text="erros.nome"></div>
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="codigoMec">Código e-MEC</label>
                    <input id="codigoMec" type="text" class="form-control" x-model="form.codigoMec"
                           maxlength="20" :class="{ 'is-invalid': erros.codigoMec }">
                    <div class="invalid-feedback" x-text="erros.codigoMec"></div>
                </div>
            </div>
            <div class="d-flex gap-2 mt-3">
                <button type="submit" class="btn btn-primary" :disabled="salvando">
                    <span x-show="!salvando" x-text="form.id ? 'Salvar alterações' : 'Cadastrar curso'"></span>
                    <span x-show="salvando" x-cloak>Salvando...</span>
                </button>
                <button type="button" class="btn btn-outline-secondary" x-show="form.id" x-cloak
                        @click="cancelar()">Cancelar</button>
            </div>
        </form>
    </div>

    <!-- Lista dos cursos do coordenador -->
    <div class="card p-4">
        <h5 class="card-title mb-3">Meus cursos</h5>
        <p class="text-muted mb-0" x-show="carregando">Carregando...</p>
        <p class="text-muted mb-0" x-show="!carregando && cursos.length === 0" x-cloak>
            Nenhum curso cadastrado ainda.
        </p>
        <div class="table-responsive" x-show="!carregando && cursos.length > 0" x-cloak>
            <table class="table table-hover align-middle mb-0">
                <thead>
                <tr>
                    <th>Curso</th>
                    <th>Código e-MEC</th>
                    <th class="text-end">Ações</th>
                </tr>
                </thead>
                <tbody>
                <template x-for="curso in cursos" :key="curso.id">
                    <tr>
                        <td x-text="curso.nome"></td>
                        <td x-text="curso.codigoMec"></td>
                        <td class="text-end">
                            <button class="btn btn-sm btn-outline-primary" @click="editar(curso)">Editar</button>
                        </td>
                    </tr>
                </template>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script th:src="@{/js/comum.js}"></script>
<script th:src="@{/js/coordenador.js}"></script>
<script th:src="@{/js/paginas/coordenador-cursos.js}"></script>

<div th:replace="~{fragments/rodape-lgpd :: rodape}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
