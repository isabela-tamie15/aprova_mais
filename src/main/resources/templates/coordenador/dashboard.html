<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprova+ | Coordenação</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script defer th:src="@{/js/comum.js}"></script>
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar-coordenador :: navbar('painel')}"></div>

<div class="container" style="max-width: 900px;">
    <h4 class="fw-bold mb-1">Painel da Coordenação</h4>
    <p class="text-muted mb-4">Cadastre a estrutura dos seus cursos para os alunos começarem o estágio.</p>

    <!-- Atalhos para os cadastros da coordenação. Cada cadastro novo ganha um cartão aqui -->
    <div class="row g-3">
        <div class="col-md-6">
            <a href="/coordenador/cursos" class="card p-4 h-100 text-decoration-none text-reset">
                <h5 class="mb-1">Cursos</h5>
                <p class="text-muted small mb-0">Cadastre os cursos que você coordena, com o código e-MEC.</p>
            </a>
        </div>
        <div class="col-md-6">
            <a href="/coordenador/turmas" class="card p-4 h-100 text-decoration-none text-reset">
                <h5 class="mb-1">Turmas</h5>
                <p class="text-muted small mb-0">Cadastre as turmas de cada curso, com semestre, período e modalidade.</p>
            </a>
        </div>
    </div>
</div>

<div th:replace="~{fragments/rodape-lgpd :: rodape}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
