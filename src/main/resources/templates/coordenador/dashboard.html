<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprova+ | Coordenação</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script defer src="/js/app.js"></script>
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark px-3 mb-4">
    <span class="navbar-brand fw-bold">Aprova+</span>
    <span class="text-white-50 small me-auto ms-3">Coordenação</span>
    <div>
        <a href="/conta/seguranca" class="btn btn-outline-light btn-sm me-2">Segurança</a>
        <button class="btn btn-outline-light btn-sm" onclick="logout()">Sair</button>
    </div>
</nav>

<div class="container" style="max-width: 800px;">
    <h4 class="fw-bold mb-1">Painel da Coordenação</h4>
    <p class="text-muted mb-4">Bem-vindo ao Aprova+</p>

    <!-- Funcionalidades da coordenação (trilhas, tipos de estágio, relatórios) previstas para as próximas entregas -->
    <div class="card p-4 text-center">
        <p class="text-muted mb-2">As funcionalidades do painel da coordenação estão em desenvolvimento.</p>
        <p class="text-muted small mb-0">
            Enquanto isso, você pode gerenciar a verificação em duas etapas da sua conta em
            <a href="/conta/seguranca">Segurança</a>.
        </p>
    </div>
</div>

<div th:replace="~{fragments/rodape-lgpd :: rodape}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
