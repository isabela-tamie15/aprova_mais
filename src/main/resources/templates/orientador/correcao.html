<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprova+ | Avaliar entrega</title>
    <link th:href="@{/vendor/bootstrap/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/vendor/inter/inter.css}" rel="stylesheet">
    <link th:href="@{/css/main.css}" rel="stylesheet">
    <link th:href="@{/css/paginas/entregas.css}" rel="stylesheet">
    <script defer th:src="@{/vendor/alpinejs/alpine.min.js}"></script>
</head>
<body>

<div th:replace="~{fragments/navbar-orientador :: navbar('correcoes')}"></div>

<!-- Avaliação da entrega -->
<div class="container pb-5" th:attr="x-data=${'avaliacaoEntrega(' + entregaId + ')'}" x-init="carregar()">
    <a href="/orientador/correcoes" class="btn btn-secondary btn-sm mb-3">← Voltar ao painel</a>

    <div class="text-muted" x-show="carregando">Carregando a entrega...</div>
    <div class="alert alert-danger" x-show="erro" x-text="erro" x-cloak></div>
    <div class="alert alert-success" x-show="sucesso" x-text="sucesso" x-cloak></div>

    <template x-if="detalhe">
        <div>
            <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-3">
                <div>
                    <h4 class="mb-1" x-text="detalhe.nomeTarefa"></h4>
                    <p class="text-muted mb-0" x-text="'Aluno: ' + detalhe.nomeAluno"></p>
                </div>
                <span class="badge fs-6" :class="classeStatus(detalhe.status)" x-text="nomeStatus(detalhe.status)"></span>
            </div>

            <!-- Versão atual e versão anterior lado a lado -->
            <div class="card p-4 mb-4">
                <div class="row g-4">
                    <div class="col-md-6">
                        <h6 class="fw-semibold" x-text="'Versão atual (' + atual().numero + ')'"></h6>
                        <p class="small text-muted mb-1" x-text="'Enviada em ' + formatarDataHora(atual().enviadaEm)"></p>
                        <a :href="linkArquivo(atual())" x-text="atual().nomeArquivo" x-show="anexoDisponivel(atual())"></a>
                        <span class="text-muted small" x-show="anexoDisponivel(atual())" x-text="'(' + formatarTamanho(atual().tamanhoBytes) + ')'"></span>
                        <p class="small text-muted mb-0" x-show="!anexoDisponivel(atual())" x-text="textoSituacaoAnexo(atual())"></p>
                        <p class="mt-2 mb-0" x-show="atual().comentarioAluno">
                            <strong>Comentário do aluno:</strong>
                            <span class="texto-livre" x-text="atual().comentarioAluno"></span>
                        </p>
                    </div>
                    <div class="col-md-6 coluna-versao-anterior">
                        <template x-if="anterior()">
                            <div>
                                <h6 class="fw-semibold" x-text="'Versão anterior (' + anterior().numero + ')'"></h6>
                                <p class="small text-muted mb-1" x-text="'Enviada em ' + formatarDataHora(anterior().enviadaEm)"></p>
                                <a :href="linkArquivo(anterior())" x-text="anterior().nomeArquivo" x-show="anexoDisponivel(anterior())"></a>
                                <p class="small text-muted mb-0" x-show="!anexoDisponivel(anterior())" x-text="textoSituacaoAnexo(anterior())"></p>
                                <div class="avaliacao-versao" x-show="anterior().resultado">
                                    <span class="badge" :class="classeStatus(anterior().resultado)"
                                          x-text="nomeStatus(anterior().resultado)"></span>
                                    <p class="mb-0 mt-2 small"><strong>Feedback dado:</strong>
                                        <span class="texto-livre" x-text="anterior().feedback || '-'"></span></p>
                                </div>
                            </div>
                        </template>
                        <p class="text-muted mb-0" x-show="!anterior()">Primeira versão desta entrega.</p>
                    </div>
                </div>
            </div>

            <div class="alert alert-warning mb-4" x-show="detalhe.exclusaoEmAnalise">
                O aluno pediu a exclusão de um anexo desta entrega. A avaliação fica parada até a decisão da secretaria ou da coordenação.
            </div>

            <!-- Formulário de avaliação, só enquanto a entrega aguarda análise -->
            <form class="card p-4 mb-4" x-show="aguardando()" @submit.prevent novalidate>
                <h5 class="fw-semibold mb-3">Avaliação</h5>

                <!-- Checklist de critérios da tarefa. Só aparece quando o coordenador cadastrou critérios -->
                <div class="mb-4" x-show="detalhe.criterios.length > 0">
                    <h6 class="fw-semibold mb-1">Checklist de critérios</h6>
                    <p class="form-text mt-0">Marque cada critério. Com algum insuficiente, a entrega só pode ser devolvida.</p>
                    <template x-for="criterio in detalhe.criterios" :key="criterio.id">
                        <div class="border rounded p-3 mb-2">
                            <div class="fw-semibold mb-2" x-text="criterio.ordem + '. ' + criterio.descricao"></div>
                            <div class="d-flex gap-4 mb-2">
                                <label class="form-check">
                                    <input type="radio" class="form-check-input" value="SUFICIENTE"
                                           :name="'resultado-' + criterio.id" x-model="respostas[criterio.id].resultado">
                                    <span class="form-check-label">Suficiente</span>
                                </label>
                                <label class="form-check">
                                    <input type="radio" class="form-check-input" value="INSUFICIENTE"
                                           :name="'resultado-' + criterio.id" x-model="respostas[criterio.id].resultado">
                                    <span class="form-check-label">Insuficiente</span>
                                </label>
                            </div>
                            <input type="text" class="form-control form-control-sm" maxlength="1000"
                                   placeholder="Observação (opcional)" x-model="respostas[criterio.id].observacao">
                        </div>
                    </template>
                    <div class="text-danger small" x-show="erros.checklist" x-text="erros.checklist"></div>
                </div>

                <div class="mb-3">
                    <label for="feedback" class="form-label">Feedback para o aluno</label>
                    <textarea id="feedback" class="form-control" rows="4" maxlength="2000" x-model="feedback"
                              :class="{ 'is-invalid': erros.feedback }"></textarea>
                    <div class="invalid-feedback" x-text="erros.feedback"></div>
                    <div class="form-text">Obrigatório para devolver. O aluno recebe um e-mail avisando do resultado.</div>
                </div>

                <div class="d-flex gap-2">
                    <!-- Com algum critério insuficiente, o botão de aprovar fica desligado -->
                    <button type="button" class="btn btn-success" :disabled="enviando || algumCriterioInsuficiente()"
                            @click="avaliar('APROVAR')">Aprovar</button>
                    <button type="button" class="btn btn-warning" :disabled="enviando"
                            @click="avaliar('DEVOLVER')">Devolver para ajustes</button>
                </div>
            </form>

            <!-- Histórico completo -->
            <div class="card p-4">
                <h5 class="fw-semibold mb-3">Histórico de versões</h5>
                <template x-for="versao in detalhe.versoes" :key="versao.id">
                    <div class="versao-entrega">
                        <div class="d-flex justify-content-between flex-wrap gap-2">
                            <strong x-text="'Versão ' + versao.numero"></strong>
                            <span class="text-muted small" x-text="'Enviada em ' + formatarDataHora(versao.enviadaEm)"></span>
                        </div>
                        <a :href="linkArquivo(versao)" x-text="versao.nomeArquivo" x-show="anexoDisponivel(versao)"></a>
                        <p class="small text-muted mb-0" x-show="!anexoDisponivel(versao)" x-text="textoSituacaoAnexo(versao)"></p>
                        <div class="avaliacao-versao" x-show="versao.resultado">
                            <span class="badge" :class="classeStatus(versao.resultado)" x-text="nomeStatus(versao.resultado)"></span>
                            <span class="text-muted small ms-2"
                                  x-text="'em ' + formatarDataHora(versao.avaliadaEm)"></span>
                            <p class="mb-1 mt-2 small" x-show="versao.feedback"><strong>Feedback:</strong>
                                <span class="texto-livre" x-text="versao.feedback"></span></p>

                            <!-- Resultado de cada critério do checklist nesta versão -->
                            <template x-for="(item, posicao) in versao.checklist" :key="posicao">
                                <div class="small mt-1">
                                    <span class="badge" :class="classeResultado(item.resultado)"
                                          x-text="nomeResultado(item.resultado)"></span>
                                    <span x-text="item.descricaoCriterio"></span>
                                    <div class="text-muted texto-livre" x-show="item.observacao"
                                         x-text="'Observação: ' + item.observacao"></div>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </template>
</div>

<script th:src="@{/js/comum.js}"></script>
<script th:src="@{/js/paginas/entregas-comum.js}"></script>
<script th:src="@{/js/paginas/orientador-correcao.js}"></script>

<div th:replace="~{fragments/rodape-lgpd :: rodape}"></div>
</body>
</html>
