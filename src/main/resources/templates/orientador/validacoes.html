<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Validações de Estágio</title>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>
<h1>Validações de Estágio</h1>

<div x-data="validacoesApp()" x-init="init()">

    <div x-show="carregando">
        <p>Carregando...</p>
    </div>

    <div x-show="!carregando && estagios.length === 0">
        <p>Nenhum estágio pendente de validação.</p>
    </div>

    <div x-show="!carregando && estagios.length > 0">
        <template x-for="estagio in estagios" :key="estagio.id">
            <div style="border: 1px solid #ccc; padding: 10px; margin: 10px 0;">
                <p>Aluno: <span x-text="estagio.nomeAluno"></span></p>
                <p>Tipo: <span x-text="estagio.nomeTipoEstagio"></span></p>
                <p>Início: <span x-text="estagio.dataInicio"></span></p>
                <p>Status: <span x-text="estagio.status"></span></p>

                <div x-show="estagio.status === 'PENDENTE'">
                    <button @click="aprovar(estagio.id)">Aprovar</button>

                    <div>
                        <input type="text"
                               x-model="justificativas[estagio.id]"
                               placeholder="Justificativa para rejeição">
                        <button @click="rejeitar(estagio.id)">Rejeitar</button>
                    </div>
                </div>
            </div>
        </template>
    </div>
    <div x-show="mensagem">
        <p x-text="mensagem"></p>
    </div>

</div>

<script>
    function validacoesApp() {
        return {
            carregando: true,
            estagios: [],
            justificativas: {},
            mensagem: '',

            async init() {
                await this.carregarPendentes();
                this.carregando = false;
            },

            async carregarPendentes() {
                try {
                    const resp = await fetch('/api/v1/orientador/validacoes', {
                        credentials: 'include'
                    });
                    if (resp.ok) {
                        this.estagios = await resp.json();
                    }
                } catch (e) {
                    console.error('Erro ao carregar pendentes', e);
                }
            },

            async aprovar(id) {
                try {
                    const resp = await fetch(`/api/v1/orientador/validacoes/${id}/aprovar`, {
                        method: 'POST',
                        credentials: 'include'
                    });

                    if (resp.ok) {
                        this.mensagem = 'Estágio aprovado com sucesso!';
                        await this.carregarPendentes();
                    } else {
                        const dados = await resp.json();
                        this.mensagem = dados.mensagem || 'Erro ao aprovar estágio.';
                    }
                } catch (e) {
                    this.mensagem = 'Não foi possível conectar ao servidor.';
                }
            },

            async rejeitar(id) {
                const justificativa = this.justificativas[id];
                if (!justificativa || justificativa.trim() === '') {
                    this.mensagem = 'Informe a justificativa antes de rejeitar.';
                    return;
                }

                try {
                    const resp = await fetch(`/api/v1/orientador/validacoes/${id}/rejeitar`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify({ justificativa })
                    });

                    if (resp.ok) {
                        this.mensagem = 'Estágio rejeitado.';
                        await this.carregarPendentes();
                    } else {
                        const dados = await resp.json();
                        this.mensagem = dados.mensagem || 'Erro ao rejeitar estágio.';
                    }
                } catch (e) {
                    this.mensagem = 'Não foi possível conectar ao servidor.';
                }
            }
        }
    }
</script>
</body>
</html>
