<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Aprova+ | Validações</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark px-3 mb-4">
    <span class="navbar-brand fw-bold">Aprova+</span>
    <div>
        <a href="/conta/seguranca" class="btn btn-outline-light btn-sm me-2">Segurança</a>
    <button class="btn btn-outline-light btn-sm" onclick="logout()">Sair</button>
    </div>
</nav>

<div class="container">
    <h4 class="mb-4">Validações de Estágio</h4>

    <!-- Sem estágios pendentes -->
    <div th:if="${#lists.isEmpty(estagios)}" class="card p-4 text-center">
        <p class="text-muted">Nenhum estágio pendente de validação.</p>
    </div>

    <div th:unless="${#lists.isEmpty(estagios)}">
        <div th:each="estagio : ${estagios}"
             th:attr="x-data=${'validacao(' + estagio.id + ')'}"
             class="card p-4 mb-3">

            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="card-title mb-0" th:text="${estagio.nomeAluno}"></h5>
                <span th:if="${estagio.status == 'PENDENTE'}" class="badge bg-warning text-dark">Pendente</span>
                <span th:if="${estagio.status == 'REJEITADO'}" class="badge bg-danger">Rejeitado</span>
            </div>

            <p><strong>Tipo:</strong> <span th:text="${estagio.nomeTipoEstagio}"></span></p>
            <p><strong>Empresa:</strong> <span th:text="${estagio.nomeEmpresa}"></span></p>
            <p><strong>CNPJ:</strong>
                <span th:text="${estagio.cnpjEmpresa != null ? estagio.cnpjEmpresa : 'Não informado'}"></span>
                <!-- RN67: situação na Receita. Sem situação, a consulta não foi possível e o orientador confere no termo -->
                <span th:if="${estagio.situacaoCnpj == 'ATIVA'}" class="badge bg-success ms-1">Ativa na Receita</span>
                <span th:if="${estagio.situacaoCnpj != null and estagio.situacaoCnpj != 'ATIVA'}"
                      class="badge bg-danger ms-1" th:text="${'Situação na Receita: ' + estagio.situacaoCnpj}"></span>
                <span th:if="${estagio.cnpjEmpresa != null and estagio.situacaoCnpj == null}"
                      class="badge bg-warning text-dark ms-1">Não verificado, conferir no termo</span>
            </p>
            <p><strong>Início:</strong> <span th:text="${estagio.dataInicio}"></span></p>

            <!-- Decisões anteriores sobre esse estágio, inclusive as rejeições de envios passados -->
            <th:block th:with="historico=${historicos.get(estagio.id)}">
            <div th:if="${historico != null and !#lists.isEmpty(historico)}" class="mb-3">
                <strong>Decisões anteriores:</strong>
                <ul class="list-unstyled small mb-0 mt-1">
                    <li th:each="decisao : ${historico}" class="mb-1">
                        <span th:if="${decisao.aprovado}" class="badge bg-success">Aprovado</span>
                        <span th:unless="${decisao.aprovado}" class="badge bg-danger">Rejeitado</span>
                        <span th:text="${#temporals.format(decisao.dataDecisao, 'dd/MM/yyyy HH:mm')}"></span>
                        <span th:if="${decisao.justificativa}" th:text="${' - ' + decisao.justificativa}"></span>
                    </li>
                </ul>
            </div>
            </th:block>

            <!-- Ações para estágios pendentes -->
            <div th:if="${estagio.status == 'PENDENTE'}">
                <div class="alert alert-danger py-2 mb-3" x-show="mensagem" x-text="mensagem"></div>

                <div class="mb-2" style="max-width: 320px;">
                    <label class="form-label small mb-1" th:for="${'dataInicio-' + estagio.id}">
                        Data de início conferida no termo de compromisso
                    </label>
                    <input type="date" class="form-control form-control-sm"
                           th:id="${'dataInicio-' + estagio.id}"
                           th:value="${estagio.dataInicio}"
                           x-ref="dataInicio" :max="dataMaxima()">
                </div>

                <div class="d-flex gap-2 align-items-start">
                    <button class="btn btn-success"
                            @click="aprovar()"
                            :disabled="processando">
                        Aprovar
                    </button>

                    <div class="d-flex gap-2 flex-grow-1">
                        <div class="flex-grow-1">
                            <input type="text"
                                   class="form-control"
                                   x-model="justificativa"
                                   maxlength="1000"
                                   placeholder="Justificativa para rejeição">
                            <div class="form-text" x-text="justificativa.length + '/1000'"></div>
                        </div>
                        <button class="btn btn-danger"
                                @click="rejeitar()"
                                :disabled="processando">
                            Rejeitar
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/js/comum.js}"></script>
<script th:src="@{/js/paginas/orientador-validacoes.js}"></script>

<div th:replace="~{fragments/rodape-lgpd :: rodape}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
