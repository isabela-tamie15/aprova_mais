<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprova+ | Histórico de correções</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/paginas/entregas.css}" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar-orientador :: navbar('historico')}"></div>

<!-- Histórico de correções: versões aprovadas ou devolvidas pelo orientador, da mais recente para a mais antiga -->
<div class="container pb-5" x-data="historicoCorrecoes()" x-init="carregar()">
    <h4 class="mb-1">Histórico de correções</h4>
    <p class="text-muted mb-4" x-cloak x-show="historico"
       x-text="historico && (historico.totalCorrecoes === 1
                ? '1 correção feita por você'
                : historico.totalCorrecoes + ' correções feitas por você')"></p>

    <div class="alert alert-danger" x-show="erro" x-text="erro" x-cloak></div>

    <div class="card">
        <div class="p-4 text-muted" x-show="carregando">Carregando...</div>
        <div class="p-4 text-center text-muted" x-cloak x-show="!carregando && historico && historico.itens.length === 0">
            Você ainda não aprovou nem devolveu nenhuma entrega.
        </div>
        <div class="table-responsive" x-cloak x-show="!carregando && historico && historico.itens.length > 0">
            <table class="table mb-0 align-middle">
                <thead class="table-light">
                <tr>
                    <th>Avaliada em</th>
                    <th>Aluno</th>
                    <th>Tarefa</th>
                    <th>Versão</th>
                    <th>Resultado</th>
                    <th>Feedback</th>
                </tr>
                </thead>
                <tbody>
                <template x-for="item in (historico ? historico.itens : [])" :key="item.entregaId + '-' + item.numeroVersao">
                    <tr>
                        <td x-text="formatarDataHora(item.avaliadaEm)"></td>
                        <td x-text="item.nomeAluno"></td>
                        <td x-text="item.nomeTarefa"></td>
                        <td x-text="item.numeroVersao"></td>
                        <td><span class="badge" :class="classeStatus(item.resultado)" x-text="nomeStatus(item.resultado)"></span></td>
                        <td style="white-space: pre-line;" x-text="item.feedback || '-'"></td>
                    </tr>
                </template>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Paginação -->
    <div x-cloak x-show="historico && historico.totalPaginas > 1">
        <div class="d-flex justify-content-between align-items-center mt-3">
            <button class="btn btn-sm btn-outline-secondary" :disabled="historico && historico.pagina === 0"
                    @click="irPara(historico.pagina - 1)">Anterior</button>
            <span class="small text-muted"
                  x-text="historico && ('Página ' + (historico.pagina + 1) + ' de ' + historico.totalPaginas)"></span>
            <button class="btn btn-sm btn-outline-secondary"
                    :disabled="historico && historico.pagina >= historico.totalPaginas - 1"
                    @click="irPara(historico.pagina + 1)">Próxima</button>
        </div>
    </div>
</div>

<script th:src="@{/js/comum.js}"></script>
<script th:src="@{/js/paginas/entregas-comum.js}"></script>
<script th:src="@{/js/paginas/orientador-historico.js}"></script>

<div th:replace="~{fragments/rodape-lgpd :: rodape}"></div>
</body>
</html>
