<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body>

<!--
   Barra de navegação das páginas do Administrador.
   Uso: <div th:replace="~{fragments/navbar-admin :: navbar('auditoria')}"></div>
   O parâmetro marca a página ativa: auditoria, convites, configuracoes ou correcoes
-->
<nav th:fragment="navbar(ativo)" class="navbar navbar-expand navbar-dark navbar-aprovamais px-3 mb-4 flex-wrap">
    <span class="navbar-brand fw-bold">
        <img th:src="@{/css/img/logo-aprova-completo.png}" class="logo-navbar" alt="Aprova+">
    </span>
    <ul class="navbar-nav me-auto flex-wrap">
        <li class="nav-item">
            <a class="nav-link" th:classappend="${ativo == 'auditoria'} ? 'active'" th:href="@{/admin/auditoria}">Auditoria</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:classappend="${ativo == 'convites'} ? 'active'" th:href="@{/admin/convites}">Convites</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:classappend="${ativo == 'configuracoes'} ? 'active'" th:href="@{/admin/configuracoes}">Configurações</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:classappend="${ativo == 'correcoes'} ? 'active'" th:href="@{/admin/correcoes}">Correções</a>
        </li>
    </ul>
    <div class="d-flex align-items-center">
        <span th:if="${usuarioLogado}" class="navbar-text small text-end lh-sm me-3 py-0">
            <span class="d-block fw-semibold text-white" th:text="${usuarioLogado.nome}"></span>
            <span class="d-block text-white-50" th:text="${usuarioLogado.email}"></span>
        </span>
        <a th:href="@{/conta/seguranca}" class="btn btn-outline-light btn-sm me-2">Segurança</a>
        <button class="btn btn-outline-light btn-sm" data-acao="sair">Sair</button>
    </div>
</nav>

</body>
</html>
