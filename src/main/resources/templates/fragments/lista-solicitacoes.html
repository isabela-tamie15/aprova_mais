<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body>

<!--
    Lista de solicitações com aprovação e reprovação, usada pela secretaria e pela coordenação.
    Precisa estar dentro de um x-data="painelSolicitacoes(...)" do /js/paginas/solicitacoes-comum.js
-->
<div th:fragment="lista">
    <div class="btn-group mb-3" role="group">
        <button type="button" class="btn btn-sm" :class="filtro === 'aguardando' ? 'btn-primary' : 'btn-outline-primary'"
                @click="filtro = 'aguardando'" x-text="'Aguardando decisão (' + aguardando() + ')'"></button>
        <button type="button" class="btn btn-sm" :class="filtro === 'todas' ? 'btn-primary' : 'btn-outline-primary'"
                @click="filtro = 'todas'">Todas</button>
    </div>

    <div class="card p-4 text-center text-muted" x-show="visiveis().length === 0">
        Nenhuma solicitação para mostrar.
    </div>

    <template x-for="solicitacao in visiveis()" :key="solicitacao.id">
        <div class="card p-4 mb-3">
            <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-2">
                <div>
                    <h6 class="mb-0" x-text="nomeTipo[solicitacao.tipo] + ': ' + solicitacao.nomeAluno"></h6>
                    <div class="small text-muted"
                         x-text="solicitacao.nomeCurso + ', turma ' + solicitacao.turma + '. Pedido em ' + formatarDataHora(solicitacao.criadoEm)"></div>
                </div>
                <span class="badge" :class="classeStatus(solicitacao.status)" x-text="nomeStatus(solicitacao)"></span>
            </div>

            <p class="mb-1"><strong>Estágio atual:</strong> <span x-text="solicitacao.nomeTipoEstagioAtual"></span></p>
            <p class="mb-1" x-show="solicitacao.nomeNovoTipoEstagio">
                <strong>Novo tipo pedido:</strong> <span x-text="solicitacao.nomeNovoTipoEstagio"></span>
            </p>
            <p class="mb-1"><strong>Motivo:</strong> <span style="white-space: pre-line;" x-text="solicitacao.motivo"></span></p>
            <p class="mb-1 small text-muted" x-show="solicitacao.nomeAnalistaSecretaria"
               x-text="'Secretaria: ' + solicitacao.nomeAnalistaSecretaria + ', em ' + formatarDataHora(solicitacao.analisadaSecretariaEm)"></p>
            <p class="mb-1 small text-muted" x-show="solicitacao.nomeAnalistaCoordenacao"
               x-text="'Coordenação: ' + solicitacao.nomeAnalistaCoordenacao + ', em ' + formatarDataHora(solicitacao.analisadaCoordenacaoEm)"></p>
            <p class="mb-1" x-show="solicitacao.justificativaReprovacao">
                <strong>Justificativa:</strong> <span x-text="solicitacao.justificativaReprovacao"></span>
            </p>
            <p class="mb-1" x-show="solicitacao.prazoArrependimento"
               x-text="'Prazo para pedir a reabertura: ' + formatarData(solicitacao.prazoArrependimento)"></p>

            <div class="mt-3" x-show="podeDecidir(solicitacao)">
                <div x-show="reprovandoId !== solicitacao.id">
                    <button class="btn btn-success btn-sm me-2" :disabled="salvando" @click="aprovar(solicitacao)">Aprovar</button>
                    <button class="btn btn-outline-danger btn-sm" :disabled="salvando" @click="abrirReprovacao(solicitacao)">Reprovar</button>
                </div>
                <div x-show="reprovandoId === solicitacao.id">
                    <label class="form-label small" :for="'justificativa-' + solicitacao.id">Justificativa da reprovação</label>
                    <textarea class="form-control mb-1" rows="2" maxlength="1000" :id="'justificativa-' + solicitacao.id"
                              x-model="justificativa"></textarea>
                    <div class="form-text mb-2" x-text="justificativa.length + '/1000'"></div>
                    <button class="btn btn-danger btn-sm me-2" :disabled="salvando" @click="reprovar(solicitacao)">Confirmar reprovação</button>
                    <button class="btn btn-outline-secondary btn-sm" :disabled="salvando" @click="reprovandoId = null">Cancelar</button>
                </div>
            </div>
        </div>
    </template>
</div>

</body>
</html>
