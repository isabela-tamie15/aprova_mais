<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body>

<!--
    Barra de navegação das telas do aluno. Cada página usa assim:
    <div th:replace="~{fragments/navbar-aluno :: navbar('painel')}"></div>
    O parâmetro diz qual link fica destacado. O botão Sair chama o logout() do /js/comum.js.
-->
<nav th:fragment="navbar(ativo)" class="navbar navbar-expand navbar-dark navbar-aprovamais px-3 mb-4 flex-wrap">
    <a class="navbar-brand fw-bold" href="/aluno/dashboard">
        <img th:src="@{/css/img/logo-aprova-completo.png}" class="logo-navbar" alt="Aprova+">
    </a>
    <ul class="navbar-nav me-auto flex-wrap">
        <li class="nav-item">
            <a class="nav-link" th:classappend="${ativo == 'painel'} ? 'active'" href="/aluno/dashboard">Painel</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:classappend="${ativo == 'trilha'} ? 'active'" href="/aluno/trilha">Minha trilha</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:classappend="${ativo == 'estagio'} ? 'active'" href="/estagio">Meu estágio</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:classappend="${ativo == 'solicitacoes'} ? 'active'" href="/aluno/solicitacoes">Solicitações</a>
        </li>
    </ul>
    <div class="d-flex align-items-center">
        <span th:if="${usuarioLogado}" class="navbar-text small text-end lh-sm me-3 py-0">
            <span class="d-block fw-semibold text-white" th:text="${usuarioLogado.nome}"></span>
            <span class="d-block text-white-50" th:text="${usuarioLogado.email}"></span>
        </span>
        <a href="/conta/seguranca" class="btn btn-outline-light btn-sm me-2">Segurança</a>
        <button class="btn btn-outline-light btn-sm" data-acao="sair">Sair</button>
    </div>
</nav>

</body>
</html>
