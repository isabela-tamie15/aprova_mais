<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body>

<!--
    Barra de navegação das telas da secretaria. Cada página usa assim:
    <div th:replace="~{fragments/navbar-secretaria :: navbar('painel')}"></div>
    O parâmetro diz qual link fica destacado. O botão Sair chama o logout() do /js/comum.js.
-->
<nav th:fragment="navbar(ativo)" class="navbar navbar-expand navbar-dark bg-dark px-3 mb-4 flex-wrap">
    <a class="navbar-brand fw-bold" href="/secretaria/dashboard">Aprova+</a>
    <ul class="navbar-nav me-auto flex-wrap">
        <li class="nav-item">
            <a class="nav-link" th:classappend="${ativo == 'painel'} ? 'active'" href="/secretaria/dashboard">Painel</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:classappend="${ativo == 'enviar-convite'} ? 'active'" href="/secretaria/enviar-convite">Enviar convite</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:classappend="${ativo == 'convites'} ? 'active'" href="/secretaria/convites">Convites</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:classappend="${ativo == 'solicitacoes'} ? 'active'" href="/secretaria/solicitacoes">Solicitações</a>
        </li>
    </ul>
    <div>
        <a href="/conta/seguranca" class="btn btn-outline-light btn-sm me-2">Segurança</a>
        <button class="btn btn-outline-light btn-sm" data-acao="sair">Sair</button>
    </div>
</nav>

</body>
</html>
