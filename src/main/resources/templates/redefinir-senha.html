<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- O token está na URL: sem isso, o navegador mandaria o link completo para os CDNs no cabeçalho Referer -->
    <meta name="referrer" content="no-referrer">
    <title>Aprova+ | Nova senha</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link th:href="@{/css/main.css}" rel="stylesheet">
    <link th:href="@{/css/paginas/recuperacao-senha.css}" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="py-5">

<div class="container" style="max-width: 520px;">
    <div class="card-principal">

        <div class="header-azul">
            <span class="badge-portal">Portal Aprova+</span>
            <h4 class="text-white fw-bold mt-2 mb-1">Criar nova senha</h4>
            <p class="mb-0" style="color: rgba(255,255,255,0.8); font-size: 0.9rem;">
                Escolha uma senha nova para a sua conta.
            </p>
        </div>

        <!-- Link usado, vencido ou inventado: nem mostra o formulário -->
        <div class="p-4" th:unless="${tokenValido}">
            <div class="alerta-erro mb-3" role="alert">
                Este link de recuperação é inválido ou expirou. Peça um novo para continuar.
            </div>
            <a href="/recuperar-senha" class="btn btn-principal w-100 d-flex align-items-center justify-content-center">
                Pedir um novo link
            </a>
            <div class="text-center mt-4">
                <a href="/login" class="link-voltar">Voltar ao login</a>
            </div>
        </div>

        <div class="p-4" th:if="${tokenValido}" x-data="redefinirSenhaForm()">
            <div class="alerta-erro mb-3" role="alert" x-show="erro" x-text="erro" x-cloak></div>

            <form @submit.prevent="salvar()" novalidate>
                <div class="mb-3">
                    <label for="senha" class="form-label fw-semibold">Nova senha</label>
                    <input id="senha" type="password" class="form-control" x-model="senha"
                           minlength="8" maxlength="72" autocomplete="new-password" autofocus>
                    <!-- Requisitos da senha, os mesmos que o backend confere -->
                    <ul class="list-unstyled small mt-2 mb-0">
                        <li :class="requisitos().tamanho ? 'text-success' : 'text-muted'">Entre 8 e 72 caracteres</li>
                        <li :class="requisitos().letra ? 'text-success' : 'text-muted'">Pelo menos uma letra</li>
                        <li :class="requisitos().numero ? 'text-success' : 'text-muted'">Pelo menos um número</li>
                    </ul>
                </div>

                <div class="mb-4">
                    <label for="confirmacaoSenha" class="form-label fw-semibold">Confirmar nova senha</label>
                    <input id="confirmacaoSenha" type="password" class="form-control" x-model="confirmacaoSenha"
                           maxlength="72" autocomplete="new-password">
                    <div class="small text-danger mt-1"
                         x-show="confirmacaoSenha && senha !== confirmacaoSenha" x-cloak>
                        As senhas não coincidem.
                    </div>
                </div>

                <button type="submit" class="btn btn-principal w-100" :disabled="!podeSalvar()">
                    <span x-show="!enviando">Salvar nova senha</span>
                    <span x-show="enviando" x-cloak>
                        <span class="spinner-border spinner-border-sm me-2"></span>
                        Salvando...
                    </span>
                </button>
            </form>
        </div>
    </div>
</div>

<script th:src="@{/js/paginas/redefinir-senha.js}"></script>

<div th:replace="~{fragments/rodape-lgpd :: rodape}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
