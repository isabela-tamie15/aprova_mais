<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Meu Estágio</title>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>
<h1>Meu Estágio</h1>

<div x-data="estagioApp()" x-init="init()">

    <div x-show="carregando">
        <p>Carregando...</p>
    </div>

    <div x-show="!carregando && !estagio && !formularioAberto">
        <p>Você ainda não cadastrou seu estágio.</p>
        <button @click="abrirFormulario()">Cadastrar Estágio</button>
    </div>

    <div x-show="!carregando && estagio">
        <h2>Situação do seu estágio</h2>
        <p>Tipo: <span x-text="estagio?.nomeTipoEstagio"></span></p>
        <p>Status: <span x-text="estagio?.status"></span></p>
        <p>Início: <span x-text="estagio?.dataInicio"></span></p>
        <p>Orientador: <span x-text="estagio?.nomeOrientador || 'Não atribuído'"></span></p>

        <div x-show="estagio?.status === 'REJEITADO'">
            <p style="color:red">Justificativa: <span x-text="estagio?.justificativaRejeicao"></span></p>
            <button @click="abrirFormulario()">Reenviar para aprovação</button>
        </div>
    </div>

    <div x-show="formularioAberto">
        <h2>Cadastrar Estágio</h2>

        <div x-show="erro" style="color:red">
            <p x-text="erro"></p>
        </div>

        <form @submit.prevent="enviar()">
            <div>
                <label>Tipo de Estágio</label>
                <select x-model="form.tipoEstagioId">
                    <option value="">Selecione...</option>
                    <template x-for="tipo in tipos" :key="tipo.id">
                        <option :value="tipo.id" x-text="tipo.nome"></option>
                    </template>
                </select>
            </div>

            <div>
                <label>Data de Início</label>
                <input type="date" x-model="form.dataInicio">
            </div>

            <button type="submit" :disabled="enviando">
                <span x-show="!enviando">Enviar para aprovação</span>
                <span x-show="enviando">Enviando...</span>
            </button>

            <button type="button" @click="formularioAberto = false">Cancelar</button>
        </form>
    </div>
</div>

<script>
    function estagioApp() {
        return {
            carregando: true,
            estagio: null,
            tipos: [],
            formularioAberto: false,
            enviando: false,
            erro: '',
            form: {
                tipoEstagioId: '',
                dataInicio: ''
            },

            async init() {
                await this.carregarEstagio();
                await this.carregarTipos();
                this.carregando = false;
            },

            async carregarEstagio() {
                try {
                    const resp = await fetch('/api/v1/aluno/estagio', {
                        credentials: 'include'
                    });
                    if (resp.status === 204) {
                        this.estagio = null;
                        return;
                    }
                    if (resp.ok) {
                        this.estagio = await resp.json();
                    }
                } catch (e) {
                    console.error('Erro ao carregar estágio', e);
                }
            },

            async carregarTipos() {
                try {
                    const resp = await fetch('/api/v1/aluno/estagio/tipos', {
                        credentials: 'include'
                    });
                    if (resp.ok) {
                        this.tipos = await resp.json();
                    }
                } catch (e) {
                    console.error('Erro ao carregar tipos', e);
                }
            },

            abrirFormulario() {
                this.formularioAberto = true;
                this.erro = '';
                this.form = { tipoEstagioId: '', dataInicio: '' };
            },

            async enviar() {
                this.erro = '';
                this.enviando = true;
                try {
                    const resp = await fetch('/api/v1/aluno/estagio', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify({
                            tipoEstagioId: Number(this.form.tipoEstagioId),
                            dataInicio: this.form.dataInicio
                        })
                    });

                    const dados = await resp.json();

                    if (!resp.ok) {
                        this.erro = dados.mensagem || 'Erro ao cadastrar estágio.';
                        return;
                    }

                    this.estagio = dados;
                    this.formularioAberto = false;

                } catch (e) {
                    this.erro = 'Não foi possível conectar ao servidor.';
                } finally {
                    this.enviando = false;
                }
            }
        }
    }
</script>
</body>
</html>
