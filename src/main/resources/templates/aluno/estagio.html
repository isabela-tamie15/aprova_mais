<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Aprova+ | Meu Estágio</title>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>

<h2>Meu Estágio</h2>
<a href="/aluno/dashboard">← Voltar ao dashboard</a>
<br><br>

<div th:if="${estagio != null and estagio.status == 'PENDENTE'}">
    <p><strong>Status:</strong> Aguardando aprovação do orientador</p>
    <p><strong>Tipo:</strong> <span th:text="${estagio.nomeTipoEstagio}"></span></p>
    <p><strong>Empresa:</strong> <span th:text="${estagio.nomeEmpresa}"></span></p>
    <p><strong>Início:</strong> <span th:text="${estagio.dataInicio}"></span></p>
</div>

<div th:if="${estagio == null or estagio.status == 'REJEITADO'}"
     x-data="estagioForm()"
     x-init="carregarTipos()">

    <div th:if="${estagio != null and estagio.status == 'REJEITADO'}">
        <p style="color: red;"><strong>Estágio rejeitado.</strong>
            Justificativa: <span th:text="${estagio.justificativaRejeicao}"></span>
        </p>
        <p>Preencha o formulário abaixo para reenviar.</p>
    </div>

    <div th:if="${estagio == null}">
        <p>Cadastre seu estágio para iniciar o processo de aprovação.</p>
    </div>

    <p x-show="erro" x-text="erro" style="color: red;"></p>

    <form @submit.prevent="enviar()">
        <div>
            <label>Tipo de Estágio</label><br>
            <select x-model="form.tipoEstagioId" required>
                <option value="">Selecione...</option>
                <template x-for="tipo in tipos" :key="tipo.id">
                    <option :value="tipo.id" x-text="tipo.nome"></option>
                </template>
            </select>
        </div>
        <br>
        <div>
            <label>Nome da Empresa</label><br>
            <input type="text" x-model="form.nomeEmpresa" required>
        </div>
        <br>
        <div>
            <label>Data de Início</label><br>
            <input type="date" x-model="form.dataInicio" required>
        </div>
        <br>
        <button type="submit" :disabled="enviando">
            <span x-show="!enviando">Enviar para aprovação</span>
            <span x-show="enviando">Enviando...</span>
        </button>
    </form>
</div>

<script>
    function estagioForm() {
        return {
            tipos: [],
            enviando: false,
            erro: '',
            form: {
                tipoEstagioId: '',
                nomeEmpresa: '',
                dataInicio: ''
            },

            async carregarTipos() {
                try {
                    const resp = await fetch('/api/v1/aluno/estagio/tipos', {
                        credentials: 'include'
                    });
                    if (resp.ok) {
                        this.tipos = await resp.json();
                    }
                } catch (e) {
                    console.error('Erro ao carregar tipos', e);
                }
            },

            async enviar() {
                this.erro = '';
                this.enviando = true;
                try {
                    const resp = await fetch('/api/v1/aluno/estagio', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify({
                            tipoEstagioId: Number(this.form.tipoEstagioId),
                            nomeEmpresa: this.form.nomeEmpresa,
                            dataInicio: this.form.dataInicio
                        })
                    });

                    if (!resp.ok) {
                        const dados = await resp.json();
                        this.erro = dados.mensagem || 'Erro ao cadastrar estágio.';
                        return;
                    }

                    window.location.href = '/aluno/dashboard';

                } catch (e) {
                    this.erro = 'Não foi possível conectar ao servidor.';
                } finally {
                    this.enviando = false;
                }
            }
        }
    }
</script>

</body>
</html>
