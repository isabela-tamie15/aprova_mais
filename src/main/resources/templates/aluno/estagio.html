<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Aprova+ | Meu Estágio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark px-3 mb-4">
    <span class="navbar-brand fw-bold">Aprova+</span>
    <button class="btn btn-outline-light btn-sm" onclick="logout()">Sair</button>
</nav>

<div class="container">

    <div class="d-flex align-items-center mb-4">
        <a href="/aluno/dashboard" class="btn btn-outline-secondary btn-sm me-3">← Voltar ao dashboard</a>
        <h4 class="mb-0">Meu Estágio</h4>
    </div>

    <div th:if="${estagio != null and estagio.status == 'PENDENTE'}" class="card p-4 mb-4">
        <h5 class="card-title mb-3">Situação Atual</h5>
        <span class="badge bg-warning text-dark mb-3">Aguardando aprovação do orientador</span>
        <p><strong>Tipo:</strong> <span th:text="${estagio.nomeTipoEstagio}"></span></p>
        <p><strong>Empresa:</strong> <span th:text="${estagio.nomeEmpresa}"></span></p>
        <p><strong>Início:</strong> <span th:text="${estagio.dataInicio}"></span></p>
    </div>

    <div th:if="${estagio == null or estagio.status == 'REJEITADO'}" x-data="estagioForm()" x-init="init()" th:attr="data-nome-empresa=${estagio != null ? estagio.nomeEmpresa : ''},data-data-inicio=${estagio != null ? estagio.dataInicio : ''}, data-tipo-estagio-nome=${estagio != null ? estagio.nomeTipoEstagio : ''}">

        <div th:if="${estagio != null and estagio.status == 'REJEITADO'}" class="alert alert-danger mb-4">
            <strong>Estágio rejeitado.</strong>
            Justificativa: <span th:text="${estagio.justificativaRejeicao}"></span>
            <p class="mb-0 mt-2">Preencha o formulário abaixo para reenviar.</p>
        </div>

        <div th:if="${estagio == null}" class="alert alert-info mb-4">
            Cadastre seu estágio para iniciar o processo de aprovação.
        </div>

        <div class="card p-4">
            <h5 class="card-title mb-3">Cadastrar Estágio</h5>

            <div class="alert alert-danger" x-show="erro" x-text="erro"></div>

            <form @submit.prevent="enviar()" novalidate>
                <div class="mb-3">
                    <label class="form-label" for="tipoEstagioId">Tipo de Estágio</label>
                    <select id="tipoEstagioId" class="form-select" x-model="form.tipoEstagioId" required
                            :class="{ 'is-invalid': erros.tipoEstagioId }">
                        <option value="">Selecione...</option>
                        <template x-for="tipo in tipos" :key="tipo.id">
                            <option :value="tipo.id"
                                    x-text="tipo.nome + ' (' + Number(tipo.cargaHorariaNecessaria) + 'h, ' + Number(tipo.jornadaSemanal) + 'h por semana)'"></option>
                        </template>
                    </select>
                    <div class="invalid-feedback" x-text="erros.tipoEstagioId"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="nomeEmpresa">Nome da Empresa</label>
                    <input id="nomeEmpresa" type="text" class="form-control" x-model="form.nomeEmpresa"
                           required minlength="2" maxlength="150"
                           :class="{ 'is-invalid': erros.nomeEmpresa }">
                    <div class="invalid-feedback" x-text="erros.nomeEmpresa"></div>
                    <div class="form-text" x-show="!erros.nomeEmpresa"
                         x-text="form.nomeEmpresa.length + '/150'"></div>
                </div>

                <div class="mb-4">
                    <label class="form-label" for="dataInicio">Data de Início</label>
                    <input id="dataInicio" type="date" class="form-control" x-model="form.dataInicio"
                           required :max="dataMaxima()"
                           :class="{ 'is-invalid': erros.dataInicio }">
                    <div class="invalid-feedback" x-text="erros.dataInicio"></div>
                </div>

                <button type="submit" class="btn btn-primary w-100" :disabled="enviando">
                    <span x-show="!enviando">Enviar para aprovação</span>
                    <span x-show="enviando">
                        <span class="spinner-border spinner-border-sm me-1"></span>
                        Enviando...
                    </span>
                </button>
            </form>
        </div>
    </div>
</div>

<script>
    function estagioForm() {
        return {
            tipos: [],
            enviando: false,
            erro: '',
            erros: {},
            form: {
                tipoEstagioId: '',
                nomeEmpresa: '',
                dataInicio: ''
            },

            async init() {
                await this.carregarTipos();

                const el = this.$el;
                const nomeEmpresa = el.dataset.nomeEmpresa;
                const dataInicio = el.dataset.dataInicio;
                const tipoEstagioNome = el.dataset.tipoEstagioNome;

                if (nomeEmpresa) this.form.nomeEmpresa = nomeEmpresa;
                if (dataInicio) this.form.dataInicio = dataInicio;

                if (tipoEstagioNome) {
                    const tipo = this.tipos.find(t => t.nome === tipoEstagioNome);
                    if (tipo) this.form.tipoEstagioId = tipo.id;
                }
            },

            async carregarTipos() {
                try {
                    const resp = await fetch('/api/v1/aluno/estagio/tipos', {
                        credentials: 'include'
                    });
                    if (resp.ok) {
                        this.tipos = await resp.json();
                    }
                } catch (e) {
                    console.error('Erro ao carregar tipos', e);
                }
            },

            // Mesmo limite do backend: a data de início pode ir no máximo 1 ano pra frente
            dataMaxima() {
                const data = new Date();
                data.setFullYear(data.getFullYear() + 1);
                // ajusta o fuso pra pegar a data local, e não a UTC
                return new Date(data.getTime() - data.getTimezoneOffset() * 60000)
                        .toISOString().slice(0, 10);
            },

            /*
               Validação na tela, pra avisar antes de enviar. O backend valida
               tudo de novo, porque essa parte pode ser contornada chamando a API direto
            */
            validar() {
                const erros = {};
                const nome = this.form.nomeEmpresa.trim();

                if (!this.form.tipoEstagioId) {
                    erros.tipoEstagioId = 'Selecione o tipo de estágio.';
                }
                if (!nome) {
                    erros.nomeEmpresa = 'Informe o nome da empresa.';
                } else if (nome.length < 2 || nome.length > 150) {
                    erros.nomeEmpresa = 'O nome da empresa deve ter entre 2 e 150 caracteres.';
                }
                if (!this.form.dataInicio) {
                    erros.dataInicio = 'Informe a data de início do estágio.';
                } else if (this.form.dataInicio > this.dataMaxima()) {
                    erros.dataInicio = 'A data de início não pode ser mais de 1 ano no futuro.';
                }

                this.erros = erros;
                return Object.keys(erros).length === 0;
            },

            async enviar() {
                this.erro = '';
                if (!this.validar()) {
                    return;
                }
                this.enviando = true;
                try {
                    const resp = await fetch('/api/v1/aluno/estagio', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify({
                            tipoEstagioId: Number(this.form.tipoEstagioId),
                            nomeEmpresa: this.form.nomeEmpresa.trim(),
                            dataInicio: this.form.dataInicio
                        })
                    });

                    if (!resp.ok) {
                        const dados = await resp.json().catch(() => ({}));
                        // Erro de validação do backend: marca cada campo com a mensagem dele
                        if (dados.campos) {
                            this.erros = dados.campos;
                        }
                        this.erro = dados.mensagem || 'Erro ao cadastrar estágio.';
                        return;
                    }

                    window.location.href = '/aluno/dashboard';

                } catch (e) {
                    this.erro = 'Não foi possível conectar ao servidor.';
                } finally {
                    this.enviando = false;
                }
            }
        }
    }

        async function logout() {
            await fetch('/api/v1/auth/logout', {
                method: 'POST',
                credentials: 'include'
            });
            window.location.href = '/login';
        }
</script>

<div th:replace="~{fragments/rodape-lgpd :: rodape}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
