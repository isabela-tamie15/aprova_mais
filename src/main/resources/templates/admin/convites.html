<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprova+ | Convites</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link th:href="@{/css/paginas/admin-convites.css}" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>

<div th:replace="~{fragments/navbar-admin :: navbar('convites')}"></div>

<div class="container pb-5" x-data="convitesAdmin()" x-init="iniciar()">
    <h4 class="fw-bold mb-1">Convites</h4>
    <p class="text-muted mb-4">O Administrador convida os coordenadores. Cada coordenador convida as secretarias, e a secretaria convida alunos e orientadores.</p>

    <div class="alert alert-danger" x-show="erro" x-text="erro" x-cloak></div>
    <div class="alert alert-success" x-show="sucesso" x-text="sucesso" x-cloak></div>

    <!-- Formulário: o perfil é sempre Coordenador, o único que o Administrador pode convidar (RN01) -->
    <form class="card-form p-4 mb-4" @submit.prevent="enviar()" novalidate>
        <h5 class="fw-semibold mb-3">Convidar coordenador</h5>
        <div class="row g-3">
            <div class="col-md-6">
                <label for="nome" class="form-label">Nome completo</label>
                <input id="nome" type="text" class="form-control" maxlength="150" x-model="form.nome"
                       :class="{ 'is-invalid': erros.nome }">
                <div class="invalid-feedback" x-text="erros.nome"></div>
            </div>
            <div class="col-md-6">
                <label for="email" class="form-label">E-mail</label>
                <input id="email" type="email" class="form-control" maxlength="254" x-model="form.emailDestino"
                       :class="{ 'is-invalid': erros.emailDestino }">
                <div class="invalid-feedback" x-text="erros.emailDestino"></div>
            </div>
        </div>
        <button type="submit" class="btn btn-primary fw-semibold mt-3" :disabled="enviando">
            <span x-show="!enviando">Enviar convite</span>
            <span x-show="enviando" x-cloak>Enviando...</span>
        </button>
    </form>

    <!-- Convites enviados pelo Administrador logado -->
    <div class="card-lista">
        <div class="px-4 py-3 borda-inferior">
            <h5 class="fw-semibold mb-0">Convites enviados</h5>
        </div>
        <p class="text-muted p-4 mb-0" x-show="carregando">Carregando...</p>
        <p class="text-muted p-4 mb-0 text-center" x-show="!carregando && convites.length === 0" x-cloak>
            Nenhum convite enviado ainda.
        </p>
        <div class="table-responsive" x-show="!carregando && convites.length > 0" x-cloak>
            <table class="table mb-0 align-middle">
                <thead class="table-light">
                <tr>
                    <th class="ps-4">E-mail</th>
                    <th>Perfil</th>
                    <th>Situação</th>
                    <th>Enviado em</th>
                    <th class="pe-4">Expira em</th>
                </tr>
                </thead>
                <tbody>
                <template x-for="convite in convites" :key="convite.id">
                    <tr>
                        <td class="ps-4 text-break" x-text="convite.email"></td>
                        <td x-text="nomePerfil(convite.perfilDestino)"></td>
                        <td><span class="badge-status" :class="'badge-' + convite.status" x-text="nomeStatus(convite.status)"></span></td>
                        <td class="text-nowrap" x-text="formatarData(convite.criadoEm)"></td>
                        <td class="pe-4 text-nowrap" x-text="formatarData(convite.expiracaoToken)"></td>
                    </tr>
                </template>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script th:src="@{/js/comum.js}"></script>
<script th:src="@{/js/paginas/admin-convites.js}"></script>
<div th:replace="~{fragments/rodape-lgpd :: rodape}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
