<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprova+ | Configurações</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link th:href="@{/css/paginas/admin-convites.css}" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar-admin :: navbar('configuracoes')}"></div>

<div class="container pb-5" x-data="configuracoesAdmin()" x-init="carregar()" style="max-width: 1000px;">
    <h4 class="fw-bold mb-1">Configurações do sistema</h4>
    <p class="text-muted mb-4">Os novos valores valem nas próximas operações. Cada alteração fica na auditoria, com o valor antigo e o novo.</p>

    <div class="alert alert-danger" x-show="erro" x-text="erro" x-cloak></div>
    <div class="alert alert-success" x-show="sucesso" x-text="sucesso" x-cloak></div>
    <p class="text-muted" x-show="carregando">Carregando...</p>

    <div class="card" x-show="!carregando" x-cloak>
        <div class="table-responsive">
            <table class="table mb-0 align-middle">
                <thead class="table-light">
                <tr>
                    <th>Parâmetro</th>
                    <th>Limites</th>
                    <th style="width: 220px;">Valor</th>
                    <th>Última alteração</th>
                </tr>
                </thead>
                <tbody>
                <template x-for="item in configuracoes" :key="item.parametro">
                    <tr>
                        <td>
                            <div x-text="item.descricao"></div>
                            <div class="small text-muted" x-text="'Padrão: ' + item.padrao + ' ' + item.unidade"></div>
                        </td>
                        <td class="small text-muted" x-text="item.minimo + ' a ' + item.maximo + ' ' + item.unidade"></td>
                        <td>
                            <div class="input-group input-group-sm">
                                <input type="number" class="form-control" :min="item.minimo" :max="item.maximo"
                                       :aria-label="item.descricao" x-model.number="valores[item.parametro]">
                                <button class="btn btn-primary" :disabled="salvando || valores[item.parametro] === item.valor"
                                        @click="salvar(item)">Salvar</button>
                            </div>
                        </td>
                        <td class="small text-muted"
                            x-text="item.alteradoEm ? item.nomeAlteradoPor + ', ' + formatarDataHora(item.alteradoEm) : 'Valor padrão'"></td>
                    </tr>
                </template>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script th:src="@{/js/comum.js}"></script>
<script th:src="@{/js/paginas/admin-administracao.js}"></script>
<div th:replace="~{fragments/rodape-lgpd :: rodape}"></div>
</body>
</html>
