<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprova+ | Recuperar senha</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link th:href="@{/css/main.css}" rel="stylesheet">
    <link th:href="@{/css/paginas/recuperacao-senha.css}" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="py-5">

<div class="container" style="max-width: 520px;">
    <div class="card-principal">

        <div class="header-azul">
            <span class="badge-portal">Portal Aprova+</span>
            <h4 class="text-white fw-bold mt-2 mb-1">Recuperar senha</h4>
            <p class="mb-0" style="color: rgba(255,255,255,0.8); font-size: 0.9rem;">
                Informe o e-mail da sua conta. Vamos enviar um link para você criar uma nova senha.
            </p>
        </div>

        <div class="p-4" x-data="recuperarSenhaForm()">
            <div class="alerta-erro mb-3" role="alert" x-show="erro" x-text="erro" x-cloak></div>

            <!-- Depois do envio, a mesma mensagem aparece para qualquer e-mail (RN10) -->
            <div x-show="enviado" x-cloak>
                <div class="alerta-sucesso mb-3" role="status" x-text="mensagem"></div>
                <p class="text-muted small mb-0">
                    O link vale por 30 minutos e pode ser usado uma única vez. Se não encontrar o e-mail,
                    confira a caixa de spam.
                </p>
            </div>

            <form @submit.prevent="enviar()" x-show="!enviado" novalidate>
                <div class="mb-3">
                    <label for="email" class="form-label fw-semibold">E-mail</label>
                    <input id="email" type="email" class="form-control" x-model="email"
                           maxlength="254" autocomplete="email" autofocus required>
                </div>
                <button type="submit" class="btn btn-principal w-100" :disabled="enviando">
                    <span x-show="!enviando">Enviar link</span>
                    <span x-show="enviando" x-cloak>
                        <span class="spinner-border spinner-border-sm me-2"></span>
                        Enviando...
                    </span>
                </button>
            </form>

            <div class="text-center mt-4">
                <a href="/login" class="link-voltar">Voltar ao login</a>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/js/paginas/recuperar-senha.js}"></script>

<div th:replace="~{fragments/rodape-lgpd :: rodape}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
