<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Validação de Estágios — Aprova+</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.5/dist/cdn.min.js" defer></script>
</head>
<body class="bg-light">

<div class="container py-5" style="max-width: 900px;" x-data="paginaValidacoes()" x-init="init()">

    <h2 class="mb-4">Validação de Estágios</h2>

    <div class="alert alert-danger" x-show="erroMensagem" x-text="erroMensagem"></div>

    <div x-show="carregando" class="text-center text-muted py-5">
        <div class="spinner-border" role="status"></div>
        <p class="mt-3">Carregando...</p>
    </div>

    <div class="card text-center p-5" x-show="!carregando && solicitacoes.length === 0">
        <p class="fs-5 mb-0">Nenhuma solicitação aguardando aprovação no momento.</p>
    </div>

    <table class="table table-bordered bg-white" x-show="!carregando && solicitacoes.length > 0">
        <thead>
        <tr>
            <th>Aluno</th>
            <th>Perfil solicitado</th>
            <th>Carga horária</th>
            <th>Data de início</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <template x-for="solicitacao in solicitacoes" :key="solicitacao.id">
            <tr>
                <td x-text="solicitacao.nomeAluno"></td>
                <td x-text="solicitacao.nomeTipoEstagio"></td>
                <td x-text="solicitacao.cargaHorariaNecessaria + 'h/semana'"></td>
                <td x-text="solicitacao.dataInicio"></td>
                <td>
                    <button class="btn btn-success btn-sm me-2" @click="aprovar(solicitacao.id)">Aprovar</button>
                    <button class="btn btn-danger btn-sm" @click="abrirRejeicao(solicitacao.id)">Rejeitar</button>
                </td>
            </tr>
        </template>
        </tbody>
    </table>

    <div class="card p-4" x-show="solicitacaoEmRejeicaoId !== null">
        <h5 class="mb-3">Justificativa da rejeição</h5>
        <textarea class="form-control mb-3" rows="3" x-model="justificativa"
                  placeholder="Explique por que esta solicitação está sendo rejeitada"></textarea>
        <div class="d-flex gap-2">
            <button class="btn btn-danger" @click="confirmarRejeicao()">Confirmar rejeição</button>
            <button class="btn btn-outline-secondary" @click="fecharRejeicao()">Cancelar</button>
        </div>
    </div>

</div>

<script>
    function paginaValidacoes() {
        return {
            carregando: true,
            solicitacoes: [],
            erroMensagem: '',
            solicitacaoEmRejeicaoId: null,
            justificativa: '',

            async init() {
                const token = localStorage.getItem('token');
                if (!token) {
                    window.location.href = '/login';
                    return;
                }
                await this.carregarPendentes();
            },

            async carregarPendentes() {
                this.carregando = true;
                this.erroMensagem = '';
                try {
                    const resposta = await fetch('/api/v1/orientador/validacoes', {
                        method: 'GET',
                        headers: {
                            'Authorization': 'Bearer ' + localStorage.getItem('token')
                        }
                    });

                    if (resposta.ok) {
                        this.solicitacoes = await resposta.json();
                    } else {
                        this.erroMensagem = 'Não foi possível carregar a lista de solicitações.';
                    }
                } catch (erro) {
                    this.erroMensagem = 'Erro de conexão com o servidor.';
                } finally {
                    this.carregando = false;
                }
            },

            async aprovar(idDaSolicitacao) {
                this.erroMensagem = '';
                try {
                    const resposta = await fetch('/api/v1/orientador/validacoes/' + idDaSolicitacao + '/aprovar', {
                        method: 'POST',
                        headers: {
                            'Authorization': 'Bearer ' + localStorage.getItem('token')
                        }
                    });

                    if (resposta.ok) {
                        await this.carregarPendentes();
                    } else {
                        const corpoDoErro = await resposta.json();
                        this.erroMensagem = corpoDoErro.mensagem || 'Não foi possível aprovar esta solicitação.';
                    }
                } catch (erro) {
                    this.erroMensagem = 'Erro de conexão com o servidor.';
                }
            },

            abrirRejeicao(idDaSolicitacao) {
                this.solicitacaoEmRejeicaoId = idDaSolicitacao;
                this.justificativa = '';
            },

            fecharRejeicao() {
                this.solicitacaoEmRejeicaoId = null;
                this.justificativa = '';
            },

            async confirmarRejeicao() {
                this.erroMensagem = '';
                try {
                    const resposta = await fetch(
                        '/api/v1/orientador/validacoes/' + this.solicitacaoEmRejeicaoId + '/rejeitar',
                        {
                            method: 'POST',
                            headers: {
                                'Authorization': 'Bearer ' + localStorage.getItem('token'),
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({ justificativa: this.justificativa })
                        }
                    );

                    if (resposta.ok) {
                        this.fecharRejeicao();
                        await this.carregarPendentes();
                    } else {
                        const corpoDoErro = await resposta.json();
                        this.erroMensagem = corpoDoErro.mensagem || 'Não foi possível rejeitar esta solicitação.';
                    }
                } catch (erro) {
                    this.erroMensagem = 'Erro de conexão com o servidor.';
                }
            }
        };
    }
</script>

</body>
</html>
