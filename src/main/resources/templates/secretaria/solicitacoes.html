<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprova+ | Solicitações</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link th:href="@{/css/paginas/secretaria-convites.css}" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-light">

<nav class="navbar navbar-dark navbar-aprovamais px-3 mb-4">
    <div class="d-flex align-items-center gap-3">
        <a href="/secretaria/dashboard" class="btn btn-outline-light btn-sm">← Voltar</a>
        <span class="navbar-brand fw-bold mb-0">Aprova+</span>
    </div>
    <button class="btn btn-outline-light btn-sm" data-acao="sair">Sair</button>
</nav>

<div class="container" x-data="painelSolicitacoes('/api/v1/secretaria/solicitacoes', 'PENDENTE', false)"
     x-init="init()" style="max-width: 900px;">
    <h4 class="fw-bold mb-1">Solicitações</h4>
    <p class="text-muted mb-4">Confira os dados do aluno e decida os pedidos de trancamento e de reabertura. O trancamento aprovado aqui segue para a coordenação.</p>

    <div class="alert alert-danger" x-show="erro" x-text="erro" x-cloak></div>
    <div class="alert alert-success" x-show="sucesso" x-text="sucesso" x-cloak></div>
    <p class="text-muted" x-show="carregando">Carregando...</p>

    <div x-show="!carregando" x-cloak>
        <div th:replace="~{fragments/lista-solicitacoes :: lista}"></div>
    </div>
</div>

<script th:src="@{/js/comum.js}"></script>
<script th:src="@{/js/paginas/solicitacoes-comum.js}"></script>

<div th:replace="~{fragments/rodape-lgpd :: rodape}"></div>
</body>
</html>
