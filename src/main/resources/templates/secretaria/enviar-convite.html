<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprova+ | Enviar Convite</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link th:href="@{/css/paginas/secretaria-enviar-convite.css}" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-dark navbar-aprovamais px-3 mb-4">
    <div class="d-flex align-items-center gap-3">
        <a href="/secretaria/dashboard" class="btn btn-outline-light btn-sm">← Voltar</a>
        <span class="navbar-brand fw-bold mb-0">Aprova+</span>
    </div>
    <button class="btn btn-outline-light btn-sm" onclick="logout()">Sair</button>
</nav>

<div class="container" style="max-width: 520px;">
    <h4 class="fw-bold mb-1">Enviar Convite de Acesso</h4>
    <p class="text-muted mb-4">
        O destinatário receberá um email com um link para concluir o cadastro.
    </p>

    <div class="card-form p-4" x-data="conviteForm()">

        <div class="alerta-erro mb-3" role="alert" x-show="erro" x-text="erro" x-cloak></div>
        <div class="alerta-sucesso mb-3" role="status" x-show="sucesso" x-cloak>
            Convite enviado com sucesso! O destinatário receberá um email em instantes.
        </div>

        <div class="mb-3">
            <label for="email" class="form-label fw-semibold">E-mail do destinatário</label>
            <input id="email"
                   type="email"
                   class="form-control"
                   placeholder="nome@email.com"
                   x-model="form.emailDestino"
                   maxlength="254"
                   :class="{ 'is-invalid': erros.emailDestino }"
                   required
                   autofocus>
            <div class="invalid-feedback" x-text="erros.emailDestino"></div>
        </div>

        <div class="mb-4">
            <label for="perfil" class="form-label fw-semibold">Perfil de acesso</label>
            <select id="perfil" class="form-select" x-model="form.perfil"
                    :class="{ 'is-invalid': erros.perfil }">
                <option value="">Selecione o perfil...</option>
                <option value="ALUNO">Aluno</option>
                <option value="ORIENTADOR">Orientador</option>
            </select>
            <div class="invalid-feedback" x-text="erros.perfil"></div>
        </div>

        <button class="btn btn-enviar w-100"
                :disabled="!podoEnviar() || enviando"
                @click="enviar()">
            <span x-show="!enviando">Enviar convite</span>
            <span x-show="enviando" x-cloak>
                <span class="spinner-border spinner-border-sm me-2"></span>
                Enviando...
            </span>
        </button>
    </div>
</div>

<script th:src="@{/js/comum.js}"></script>
<script th:src="@{/js/paginas/secretaria-enviar-convite.js}"></script>
<div th:replace="~{fragments/rodape-lgpd :: rodape}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
