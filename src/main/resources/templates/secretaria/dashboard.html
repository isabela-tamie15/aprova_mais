<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprova+ | Secretaria</title>
    <link th:href="@{/vendor/bootstrap/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/css/main.css}" rel="stylesheet">
    <link th:href="@{/vendor/inter/inter.css}" rel="stylesheet">
    <link th:href="@{/css/paginas/secretaria-dashboard.css}" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar-secretaria :: navbar('painel')}"></div>

<div class="container" style="max-width: 800px;">
    <h4 class="fw-bold mb-1">Painel da Secretaria</h4>
    <p class="text-muted mb-4">Gerencie os acessos ao sistema Aprova+</p>

    <div class="row g-3">
        <div class="col-md-6">
            <a href="/secretaria/enviar-convite" class="card-acao p-4">
                <div class="d-flex align-items-center gap-3 mb-3">
                    <div class="icone-card bg-primary bg-opacity-10">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
                             stroke="#2B4ECC" stroke-width="2">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                            <polyline points="22,6 12,13 2,6"/>
                        </svg>
                    </div>
                    <h6 class="fw-bold mb-0">Enviar Convite</h6>
                </div>
                <p class="text-muted small mb-0">
                    Envie um convite de acesso para um novo aluno ou orientador.
                </p>
            </a>
        </div>

        <div class="col-md-6">
            <a href="/secretaria/convites" class="card-acao p-4">
                <div class="d-flex align-items-center gap-3 mb-3">
                    <div class="icone-card bg-success bg-opacity-10">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
                             stroke="#16a34a" stroke-width="2">
                            <path d="M9 11l3 3L22 4"/>
                            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
                        </svg>
                    </div>
                    <h6 class="fw-bold mb-0">Meus Convites</h6>
                </div>
                <p class="text-muted small mb-0">
                    Acompanhe o status dos convites enviados.
                </p>
            </a>
        </div>

        <div class="col-md-6">
            <a href="/secretaria/solicitacoes" class="card-acao p-4">
                <div class="d-flex align-items-center gap-3 mb-3">
                    <div class="icone-card bg-warning bg-opacity-10">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
                             stroke="#b45309" stroke-width="2">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                            <polyline points="14 2 14 8 20 8"/>
                            <line x1="9" y1="15" x2="15" y2="15"/>
                        </svg>
                    </div>
                    <h6 class="fw-bold mb-0">Solicitações</h6>
                </div>
                <p class="text-muted small mb-0">
                    Analise os pedidos de trancamento e de reabertura dos alunos.
                </p>
            </a>
        </div>
    </div>
</div>

<script th:src="@{/js/comum.js}"></script>
<div th:replace="~{fragments/rodape-lgpd :: rodape}"></div>

<script th:src="@{/vendor/bootstrap/bootstrap.bundle.min.js}"></script>
</body>
</html>
