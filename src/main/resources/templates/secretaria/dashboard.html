<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprova+ | Secretaria</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background-color: #f8f9fa; }
        .navbar-aprovamais { background-color: #2B4ECC; }
        .card-acao {
            border: none;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            transition: transform 0.15s, box-shadow 0.15s;
            text-decoration: none;
            color: inherit;
            display: block;
        }
        .card-acao:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            color: inherit;
        }
        .icone-card {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-dark navbar-aprovamais px-3 mb-4">
    <span class="navbar-brand fw-bold">Aprova+</span>
    <span class="text-white-50 small me-auto ms-3">Secretaria</span>
    <button class="btn btn-outline-light btn-sm" onclick="logout()">Sair</button>
</nav>

<div class="container" style="max-width: 800px;">
    <h4 class="fw-bold mb-1">Painel da Secretaria</h4>
    <p class="text-muted mb-4">Gerencie os acessos ao sistema Aprova+</p>

    <div class="row g-3">
        <div class="col-md-6">
            <a href="/secretaria/enviar-convite" class="card-acao p-4">
                <div class="d-flex align-items-center gap-3 mb-3">
                    <div class="icone-card bg-primary bg-opacity-10">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
                             stroke="#2B4ECC" stroke-width="2">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                            <polyline points="22,6 12,13 2,6"/>
                        </svg>
                    </div>
                    <h6 class="fw-bold mb-0">Enviar Convite</h6>
                </div>
                <p class="text-muted small mb-0">
                    Envie um convite de acesso para um novo aluno ou orientador.
                </p>
            </a>
        </div>

        <div class="col-md-6">
            <a href="/secretaria/convites" class="card-acao p-4">
                <div class="d-flex align-items-center gap-3 mb-3">
                    <div class="icone-card bg-success bg-opacity-10">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
                             stroke="#16a34a" stroke-width="2">
                            <path d="M9 11l3 3L22 4"/>
                            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
                        </svg>
                    </div>
                    <h6 class="fw-bold mb-0">Meus Convites</h6>
                </div>
                <p class="text-muted small mb-0">
                    Acompanhe o status dos convites enviados.
                </p>
            </a>
        </div>
    </div>
</div>

<script>
    async function logout() {
        await fetch('/api/v1/auth/logout', { method: 'POST', credentials: 'include' });
        window.location.href = '/login';
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
