### Servidor ###
### O HTTPS termina no proxy do Render: a aplicação recebe HTTP na porta PORT e lê os cabeçalhos X-Forwarded do proxy
server.port=${PORT:8080}
server.forward-headers-strategy=native

### Banco: o DB_URL completo, ou as partes que o Render entrega (render.yaml) ###
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}}

### Templates em cache ###
spring.thymeleaf.cache=true

### Redis: no Render, o REDIS_URL vem do Key Value; no Docker, redis://:senha@redis:6379 ###
spring.data.redis.url=${REDIS_URL}

### Cookie do login em HTTPS###
app.cookie.secure=true

### Cloudflare R2 ###
r2.access-key=${R2_ACCESS_KEY:}
r2.secret-key=${R2_SECRET_KEY:}
r2.bucket=${R2_BUCKET:}
r2.endpoint=${R2_ENDPOINT:}
r2.region=auto

#Swagger desativado em producao
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

### Logs restritos em prod ###
logging.level.tcc.ges.aprovamais=INFO
logging.level.org.springframework.security=WARN