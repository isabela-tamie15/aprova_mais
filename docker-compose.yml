# Postgres, Redis, Prometheus e Grafana só aceitam conexão desta máquina (127.0.0.1)
services:

  backend:
    build: .
    container_name: aprovamais-backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      # Dentro do Docker, o Redis é sempre o contêiner redis, na porta 6379
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # No perfil prod, o Redis vem do REDIS_URL
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Volumes nomeados, porque o contêiner roda sem root
    volumes:
      - logs_data:/app/logs
      - uploads_data:/app/uploads
    restart: unless-stopped

  postgres:
    image: postgres:18
    container_name: aprovamais-postgres
    environment:
      POSTGRES_DB: dbaprovamais
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d dbaprovamais"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis com a senha do REDIS_PASSWORD
  redis:
    image: redis:7-alpine
    container_name: aprovamais-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Defina REDIS_PASSWORD no .env}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Monitoramento: Prometheus lendo a porta 9090 do backend e Grafana em http://localhost:3000
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: aprovamais-prometheus
    volumes:
      - ./monitoramento/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9091:9090"
    depends_on:
      - backend
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    container_name: aprovamais-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_SENHA:?Defina GRAFANA_SENHA no .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoramento/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoramento/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  logs_data:
  uploads_data:
  prometheus_data:
  grafana_data: